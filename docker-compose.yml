version: "3.9"

# Profiles:
#   (none) — Redis only, for local test runs
#   full   — Complete reference stack: gateway, auth, Kafka, observability

services:
  # ---------------------------------------------------------------------------
  # Core infrastructure — always available (no profile)
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Full-stack services — started only with --profile full
  # ---------------------------------------------------------------------------

  # Three independent Redis nodes for Redlock quorum
  redis-node-1:
    image: redis:7-alpine
    profiles: [full]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    image: redis:7-alpine
    profiles: [full]
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-3:
    image: redis:7-alpine
    profiles: [full]
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # pgvector — persistent vector store for knowledge base
  pgvector:
    image: pgvector/pgvector:pg16
    profiles: [full]
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-mcp-dev-password}
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Zookeeper — required by Confluent Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    profiles: [full]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    profiles: [full]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listener sets: internal (container→container) and external (host→container)
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # OAuth 2.1 authorization server
  auth:
    build: .
    profiles: [full]
    command: ["python", "-m", "mcp_agent_factory.auth", "serve"]
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AUTH_PORT: "8001"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mcp-auth
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/.well-known/oauth-authorization-server')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MCP API Gateway
  # After code changes, rebuild before starting: docker compose --profile full up --build -d
  gateway:
    build: .
    profiles: [full]
    command: ["python", "-m", "uvicorn", "mcp_agent_factory.gateway.app:gateway_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AUTH_SERVER_URL: http://auth:8001
      MCP_DEV_MODE: ${MCP_DEV_MODE:-0}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b-q4_K_M}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE:-legacy}
      PYDANTIC_AI_MODEL: ${PYDANTIC_AI_MODEL:-google-gla:gemini-2.5-flash}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: mcp-gateway
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Caddy — terminates TLS at :443, proxies to gateway:8000
  caddy:
    image: caddy:2-alpine
    profiles: [full]
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ---------------------------------------------------------------------------
  # Observability stack
  # ---------------------------------------------------------------------------

  # Jaeger all-in-one — distributed tracing backend + UI
  jaeger:
    image: jaegertracing/all-in-one:1.57
    profiles: [full]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
      PROMETHEUS_QUERY_NAMESPACE: traces
      PROMETHEUS_QUERY_SUPPORT_SPANMETRICS_CONNECTOR: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "14269:14269"   # Admin/health
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # OTel Collector — receives OTLP from gateway, generates span metrics for Prometheus, forwards traces to Jaeger
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    profiles: [full]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    depends_on:
      jaeger:
        condition: service_healthy
    ports:
      - "4317:4317"   # OTLP gRPC (gateway sends here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Prometheus — metrics scraper
  prometheus:
    image: prom/prometheus:v2.51.2
    profiles: [full]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # Prometheus Pushgateway — accepts metric pushes from batch jobs and demo scripts
  pushgateway:
    image: prom/pushgateway:v1.8.0
    profiles: [full]
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana — dashboards
  grafana:
    image: grafana/grafana:10.4.2
    profiles: [full]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Infrastructure browser UIs — open in browser after `docker compose --profile full up`
  # ---------------------------------------------------------------------------

  # Kafka UI — browse topics, consumer groups, and messages at http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [full]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8085:8080"

  # Kafka consumer — creates a visible consumer group for the Kafka UI consumer-groups page
  kafka-consumer:
    image: confluentinc/cp-kafka:7.5.0
    profiles: [full]
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "sleep 20 && kafka-console-consumer
      --bootstrap-server kafka:29092
      --topic agents.analyze
      --group mcp-demo-consumer
      --from-beginning
      --timeout-ms 300000"
    restart: unless-stopped

  # Redis Commander — inspect keys, streams, and pub/sub at http://localhost:8086
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: [full]
    depends_on:
      redis:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    environment:
      REDIS_HOSTS: "main:redis:6379,node1:redis-node-1:6379,node2:redis-node-2:6379,node3:redis-node-3:6379"
    ports:
      - "8086:8081"

  # MCP Inspector — visual introspection of MCP tool boundaries and handshake
  # Access: http://localhost:6274
  # Transports:
  #   STDIO          → command: npx -y @modelcontextprotocol/server-everything
  #   Streamable HTTP → URL: http://gateway:8000/mcp
  mcp-inspector:
    image: node:20-alpine
    profiles: [full]
    # host network: inspector proxy runs on the host network stack so that
    # localhost:8000 (gateway) and localhost:6274/6277 (inspector) all share
    # the same loopback — no socat hack needed, no Docker DNS required.
    network_mode: host
    command: >
      sh -c "npm install -g @modelcontextprotocol/inspector @modelcontextprotocol/server-everything &&
             npx @modelcontextprotocol/inspector"
    environment:
      HOST: "0.0.0.0"
      CLIENT_PORT: "6274"
      SERVER_PORT: "6277"
      # Skip token auth — inspector is LAN-only dev tooling
      DANGEROUSLY_OMIT_AUTH: "true"
      # Default URL points to gateway on host-mapped port 8000
      DEFAULT_MCP_SERVER_URL: "http://localhost:8000/mcp"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  grafana_data:
  pgvector_data:
