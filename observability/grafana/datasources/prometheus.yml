apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: infinity
    type: yesoreyeram-infinity-datasource
    uid: infinity
    access: proxy
    editable: false
    jsonData:
      allowedHosts:
        - "http://gateway:8000"
        - "gateway:8000"
